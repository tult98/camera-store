version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: camera-store-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: camera-store-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: camera_store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
