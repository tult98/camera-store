name: Chromatic

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Check if UI is affected
        id: check-ui
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            BASE="HEAD~1"
          else
            BASE="origin/${{ github.base_ref }}"
          fi
          AFFECTED=$(yarn nx show projects --affected --base=$BASE 2>/dev/null || echo "")
          if echo "$AFFECTED" | grep -qw "ui"; then
            echo "affected=true" >> $GITHUB_OUTPUT
          else
            echo "affected=false" >> $GITHUB_OUTPUT
            echo "UI project not affected, skipping Chromatic"
          fi

      - name: Build Storybook
        if: steps.check-ui.outputs.affected == 'true'
        run: yarn nx run ui:build-storybook

      - name: Publish to Chromatic
        if: steps.check-ui.outputs.affected == 'true'
        uses: chromaui/action@v13
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: libs/ui/storybook-static
          exitOnceUploaded: true
          autoAcceptChanges: 'development'
