name: Deploy to Railway

on:
  push:
    branches: [development]

env:
  NX_CLOUD_DISTRIBUTED_EXECUTION: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      affected-backend: ${{ steps.affected.outputs.backend }}
      affected-frontend: ${{ steps.affected.outputs.frontend }}
      affected-admin-dashboard: ${{ steps.affected.outputs.admin-dashboard }}
      affected-core-api: ${{ steps.affected.outputs.core-api }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Check affected projects
        id: affected
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="origin/${{ github.ref_name }}"
          fi

          echo "Base SHA for comparison: $BASE_SHA"
          AFFECTED_APPS=$(npx nx show projects --affected --base=$BASE_SHA --projects=backend,frontend,admin-dashboard,core-api)

          echo "Affected apps: $AFFECTED_APPS"

          if echo "$AFFECTED_APPS" | grep -q "backend"; then
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=false" >> $GITHUB_OUTPUT
          fi

          if echo "$AFFECTED_APPS" | grep -q "frontend"; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi

          if echo "$AFFECTED_APPS" | grep -q "admin-dashboard"; then
            echo "admin-dashboard=true" >> $GITHUB_OUTPUT
          else
            echo "admin-dashboard=false" >> $GITHUB_OUTPUT
          fi

          if echo "$AFFECTED_APPS" | grep -q "core-api"; then
            echo "core-api=true" >> $GITHUB_OUTPUT
          else
            echo "core-api=false" >> $GITHUB_OUTPUT
          fi

  quality-checks:
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.affected-backend == 'true' || needs.setup.outputs.affected-frontend == 'true' || needs.setup.outputs.affected-admin-dashboard == 'true' || needs.setup.outputs.affected-core-api == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Run linting
        run: yarn nx affected -t lint
        env:
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${{ secrets.MEDUSA_PUBLISHABLE_KEY }}

      - name: Run type checking
        run: yarn nx affected -t type-check
        env:
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${{ secrets.MEDUSA_PUBLISHABLE_KEY }}

  deploy-backend:
    runs-on: ubuntu-latest
    needs: [setup, quality-checks]
    if: needs.setup.outputs.affected-backend == 'true' && always() && needs.quality-checks.result == 'success'
    environment: staging
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy Backend to Railway
        run: railway up --service=${{ vars.RAILWAY_BACKEND_SERVICE_NAME }}

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [setup, quality-checks]
    if: needs.setup.outputs.affected-frontend == 'true' && always() && needs.quality-checks.result == 'success'
    environment: staging
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy Frontend to Railway
        run: railway up --service=${{ vars.RAILWAY_FRONTEND_SERVICE_NAME }}

  deploy-admin-dashboard:
    runs-on: ubuntu-latest
    needs: [setup, quality-checks]
    if: needs.setup.outputs.affected-admin-dashboard == 'true' && always() && needs.quality-checks.result == 'success'
    environment: staging
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy Admin Dashboard to Railway
        run: railway up --service=${{ vars.RAILWAY_ADMIN_DASHBOARD_SERVICE_NAME }}

  deploy-core-api:
    runs-on: ubuntu-latest
    needs: [setup, quality-checks]
    if: needs.setup.outputs.affected-core-api == 'true' && always() && needs.quality-checks.result == 'success'
    environment: staging
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy Core API to Railway
        run: railway up --service=${{ vars.RAILWAY_CORE_API_SERVICE_NAME }}

  deploy-status:
    runs-on: ubuntu-latest
    needs: [setup, deploy-backend, deploy-frontend, deploy-admin-dashboard, deploy-core-api]
    if: always()
    steps:
      - name: Deployment Status
        run: |
          echo "🚀 Deployment Summary:"
          echo "Backend affected: ${{ needs.setup.outputs.affected-backend }}"
          echo "Frontend affected: ${{ needs.setup.outputs.affected-frontend }}"
          echo "Admin Dashboard affected: ${{ needs.setup.outputs.affected-admin-dashboard }}"
          echo "Core API affected: ${{ needs.setup.outputs.affected-core-api }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Environment: staging"

          if [ "${{ needs.deploy-backend.result }}" = "success" ]; then
            echo "✅ Backend deployment successful"
          elif [ "${{ needs.setup.outputs.affected-backend }}" = "true" ]; then
            echo "❌ Backend deployment failed"
          else
            echo "⏭️ Backend deployment skipped (not affected)"
          fi

          if [ "${{ needs.deploy-frontend.result }}" = "success" ]; then
            echo "✅ Frontend deployment successful"
          elif [ "${{ needs.setup.outputs.affected-frontend }}" = "true" ]; then
            echo "❌ Frontend deployment failed"
          else
            echo "⏭️ Frontend deployment skipped (not affected)"
          fi

          if [ "${{ needs.deploy-admin-dashboard.result }}" = "success" ]; then
            echo "✅ Admin Dashboard deployment successful"
          elif [ "${{ needs.setup.outputs.affected-admin-dashboard }}" = "true" ]; then
            echo "❌ Admin Dashboard deployment failed"
          else
            echo "⏭️ Admin Dashboard deployment skipped (not affected)"
          fi

          if [ "${{ needs.deploy-core-api.result }}" = "success" ]; then
            echo "✅ Core API deployment successful"
          elif [ "${{ needs.setup.outputs.affected-core-api }}" = "true" ]; then
            echo "❌ Core API deployment failed"
          else
            echo "⏭️ Core API deployment skipped (not affected)"
          fi
